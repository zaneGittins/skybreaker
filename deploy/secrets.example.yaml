# /etc/skybreaker/secrets.yaml, mode 0600, readable by the skybreaker user only.
# Every secret lists the hosts it may be sent to. A request to any other host
# gets nothing injected and fails closed.
secrets:
  - name: github_app
    kind: github_app
    hosts: [github.com, api.github.com]
    github_app:
      app_id: "123456"
      key_file: /etc/skybreaker/github-app.pem   # contents:write, pull_requests:write, issues:write, metadata:read
      # installation_id: 7890                       # looked up per repo when omitted
      # Or, instead of app_id and key_file, create the App in Skybreaker's
      # Settings (it keeps the key in app-secrets.json):
      # from_app: true

  - name: anthropic
    kind: file
    file: /etc/skybreaker/anthropic-key
    hosts: [api.anthropic.com]

  - name: do_token
    kind: env
    env: SKYBREAKER_DO_TOKEN
    hosts: [api.digitalocean.com]

  - name: k8s_prod
    kind: k8s_tokenrequest
    hosts: [abc123.k8s.ondigitalocean.com]
    k8s_tokenrequest:
      api_server: https://abc123.k8s.ondigitalocean.com
      ca_file: /etc/skybreaker/k8s-prod-ca.crt
      bearer_file: /etc/skybreaker/k8s-prod-minter   # may only create tokens for this one ServiceAccount
      namespace: apps
      service_account: skybreaker-agent
      ttl: 15m
