name: "CLA Assistant"

# pull_request_target is what lets the CLA bot comment on and set a status
# for pull requests from forks. It is safe here because nothing from the pull
# request runs: no checkout, no run steps, and the only PR-controlled input
# (a comment's text) is compared in an `if`, never expanded into a command.
on: # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

# One run per pull request at a time, so two comments can't race to write
# the signatures file.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  CLAAssistant:
    name: CLA
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write # re-run the check on "recheck"
      contents: write # commit signatures to the cla-signatures branch
      pull-requests: write # comment on the pull request
      statuses: write # set the CLA status
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/zaneGittins/skybreaker/blob/main/CLA.md"
          # Not main: main takes changes only through pull requests, which
          # the bot's commits aren't.
          branch: "cla-signatures"
          allowlist: "dependabot[bot],renovate[bot],github-actions[bot]"
          # Lock PR comments after merge so signatures can't be revoked
          lock-pullrequest-aftermerge: true
