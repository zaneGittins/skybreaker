version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # skybreaker-setup, its own module so the server takes none of its dependencies.
  - package-ecosystem: "gomod"
    directory: "/setup"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "docker"
    directory: "/images/sandbox"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    # The base moves from one Ubuntu LTS to the next by hand, after testing
    # gVisor and the inner dockerd on it; interim releases are never wanted.
    ignore:
      - dependency-name: "ubuntu"
