<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#191816">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Skybreaker">
  <title>Skybreaker</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
  <!-- The terminal's code, fetched while idle so a session opens at once. -->
  <link rel="prefetch" href="/vendor/xterm.js">
  <link rel="prefetch" href="/vendor/addon-fit.js">
  <link rel="prefetch" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/activity.css">
  <link rel="stylesheet" href="/board.css">
  <link rel="stylesheet" href="/shell.css">
  <script src="/theme.js"></script>
</head>
<body>
  <!-- Desktop: the sidebar is the navigation. Phones: the top bar. -->
  <aside class="sidebar" aria-label="Skybreaker">
    <a class="brand" href="/" data-link>
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4.4" fill="#F6C443"/><g class="ring"><path d="M24.93 14.9A9 9 0 1 1 17.1 7.07" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="23.3" cy="8.7" r="1.5" fill="#F08A5D"/></g></svg>
      <span class="wordmark">skybreaker</span>
    </a>
    <button class="new-chat" id="new-chat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg><span id="new-chat-label">New chat</span></button>
    <nav class="side-nav" aria-label="Views">
      <a class="side-link" id="nav-inbox" href="/" data-link><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><span>Inbox</span><span class="side-count" id="inbox-count" hidden></span></a>
      <a class="side-link activity-link" id="nav-activity" href="/activity" data-link><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10c-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><span>Activity</span><span class="side-badge" aria-hidden="true"></span></a>
    </nav>
    <div class="side-label">Projects</div>
    <nav class="side-projects" id="side-projects" aria-label="Projects"></nav>
    <div class="side-foot">
      <span class="side-user" id="side-user"></span>
      <button class="icon-btn push-btn" type="button" aria-label="Notifications" hidden></button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme"></button>
    </div>
  </aside>
  <header class="topbar">
    <a class="brand" href="/" data-link aria-label="Skybreaker home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4.4" fill="#F6C443"/><g class="ring"><path d="M24.93 14.9A9 9 0 1 1 17.1 7.07" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="23.3" cy="8.7" r="1.5" fill="#F08A5D"/></g></svg>
    </a>
    <nav class="crumb" id="crumb"></nav>
    <div class="topbar-right">
      <a class="icon-btn activity-link" id="activity-btn" href="/activity" data-link aria-label="Activity" title="Activity"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10c-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></a>
      <button class="icon-btn push-btn" type="button" aria-label="Notifications" hidden></button>
    </div>
  </header>
  <main id="app"></main>
  <div id="sheet-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/lib.js"></script>
  <script src="/dom.js"></script>
  <script src="/chatlib.js"></script>
  <script src="/chat.js"></script>
  <script src="/board.js"></script>
  <script src="/app.js"></script>
</body>
</html>
